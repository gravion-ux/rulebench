[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rulebench"
version = "0.1.0"
description = "Behavioral conformance harness for Sigma detection rules."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Priyanshu Kumar Thakur (Gravion)" }]
keywords = [
    "sigma",
    "detection-engineering",
    "security",
    "conformance",
    "siem",
    "appsec",
    "red-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.6"]

[project.scripts]
rulebench = "rulebench.cli:main"

[project.urls]
Homepage = "https://github.com/gravion-ux/rulebench"
Issues = "https://github.com/gravion-ux/rulebench/issues"
Changelog = "https://github.com/gravion-ux/rulebench/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
